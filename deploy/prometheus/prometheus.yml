# WP-D3: scrape config for BizBoard. Scrape over the private network only; never expose
# /metrics or worker port 9100 publicly. METRICS_TOKEN must match the api's env.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  # The api sums every gunicorn worker (PROMETHEUS_MULTIPROC_DIR) and adds scrape-time gauges:
  # queue depth per queue, books-check failures, DB / Redis / beat health, dead letters.
  - job_name: bizboard-api
    metrics_path: /api/v1/metrics/
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["api:8000"]

  # Each Celery worker container serves its task durations and failures on 9100.
  - job_name: bizboard-worker
    static_configs:
      - targets: ["worker:9100"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
