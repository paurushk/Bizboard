; PgBouncer template (7.3). Not wired into compose — Human enables after soak.
; Transaction pooling + Django CONN_MAX_AGE>0 drops prepared statements / server-side
; cursors. Set CONN_MAX_AGE=0 (or pool_mode=session) before pointing DATABASE_URL here.

[databases]
bizboard = host=db port=5432 dbname=bizboard

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
min_pool_size = 2
reserve_pool_size = 4
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits,options
admin_users = postgres
stats_users = postgres
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
; Fail closed: do not log passwords or full queries.
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
application_name_add_host = 1
