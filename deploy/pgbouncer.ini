; PgBouncer template (7.3). Not wired into compose — Human enables after soak.
; SR0-06: SESSION mode is required today. core/rls.py binds the tenant with
; set_config('app.company_id', ..., false) — a session-level GUC set in autocommit — so in
; transaction mode the next statement can run on a backend still carrying another tenant's
; app.company_id. Do not switch to pool_mode=transaction until WP-C4 (SET LOCAL per
; transaction) ships with its pgbouncer-in-CI test. Keep Django CONN_MAX_AGE=0 behind it.

[databases]
bizboard = host=db port=5432 dbname=bizboard

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = session
max_client_conn = 200
default_pool_size = 20
min_pool_size = 2
reserve_pool_size = 4
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits,options
admin_users = postgres
stats_users = postgres
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
; Fail closed: do not log passwords or full queries.
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
application_name_add_host = 1
