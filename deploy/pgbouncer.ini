; PgBouncer for api/worker/beat (WP-5, BB-068). Wired by docker-compose.pgbouncer.yml; off unless
; that overlay is added. See docs/ops/POSTGRES.md.
;
; SR0-06: SESSION mode is required today. core/rls.py binds the tenant with
; set_config('app.company_id', ..., false) — a session-level GUC set in autocommit — so in
; transaction mode the next statement can run on a backend still carrying another tenant's
; app.company_id. Do not switch to pool_mode=transaction until WP-C4 (SET LOCAL per
; transaction) ships with its pgbouncer-in-CI test. Keep Django CONN_MAX_AGE=0 behind it
; (settings refuse to boot otherwise when DB_VIA_PGBOUNCER=1).
;
; Timeouts: the libpq startup `options` from settings.py is accepted and dropped here
; (ignore_startup_parameters), so statement_timeout / idle_in_transaction_session_timeout are set
; on the app role instead (scripts/sql/app_role.sql). DISCARD ALL resets to those role values.
;
; Auth: auth_query through the pgbouncer_auth role, which can only call pgbouncer.user_lookup()
; (scripts/sql/app_role.sql). Only pgbouncer_auth's own password is in the auth file, and that file
; is written to tmpfs at container start. Superusers cannot sign in through the pool; migrate,
; backup and restore connect to db directly.

[databases]
* = host=db port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /tmp/pgbouncer/userlist.txt
auth_user = pgbouncer_auth
auth_query = SELECT uname, phash FROM pgbouncer.user_lookup($1)
pool_mode = session
max_client_conn = 200
default_pool_size = 20
min_pool_size = 0
reserve_pool_size = 4
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits,options
; Fail closed: do not log passwords or full queries.
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
application_name_add_host = 1
