# mutmut 3 reads its settings from here (it has no command-line flags for targets or runner).
# Run on Linux/WSL or in CI via scripts/mutation_audit.sh; mutmut has no native-Windows support.
[mutmut]
source_paths =
    accounting/services.py
    core/services/place_of_supply.py
    core/services/billing.py
    reporting/tds_worksheets.py
    inventory/services.py
# mutmut copies only the mutated files and tests into mutants/; Django needs every app importable.
also_copy =
    manage.py
    pytest.ini
    tests
    accounting
    accounts
    agents
    banking
    billing
    complaints
    config
    contracts
    core
    crm
    imports
    insights
    insurance
    integrations
    inventory
    jobwork
    ledgers
    manufacturing
    masters
    ops
    payments
    payroll
    planwave
    projects
    purchases
    quality
    reporting
    sales
    search
    support
    workshop
# The fast subset that exercises the targets; keep it tight so a run finishes.
pytest_add_cli_args_test_selection =
    tests/gst/
    tests/workflows/test_wf01_sale_intrastate.py
    tests/workflows/test_wf04_purchase.py
    tests/test_invariants_smoke.py
    tests/test_money_contract.py
    tests/test_cft_checklist.py
    tests/test_purchase_status_semantics.py
    tests/test_holistic_95.py
    tests/test_money_in_phase2.py
    tests/test_money_in_phase2_b.py
    tests/test_a11_a12_stock_cost.py
    tests/test_inventory_gl_wp12.py
    tests/test_inventory_replenishment.py
    tests/test_bug_open_acc.py
    tests/test_pr6_period_gl.py
    tests/test_bank_account_settings.py
    tests/test_inventory_godowns_wp14.py
    tests/test_inventory_valuation_paths.py
    tests/test_w0_valuation.py
    tests/test_stock_flow.py
    tests/personas/test_pj_batch_expiry.py
    tests/personas/test_pj_serialized.py
    tests/test_sales_returns_fix.py
    tests/test_order_partial_shipments.py
pytest_add_cli_args =
    -p
    no:randomly
    -p
    no:cacheprovider
    -q
