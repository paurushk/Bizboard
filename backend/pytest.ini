[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = test_*.py
testpaths = tests
# --reuse-db: skip the ~3 min of SQLite migrations on every local run (the test
# DB is a file, see config/settings_test.py). Run `pytest --create-db` once
# after changing a migration. CI (Postgres, fresh container) is unaffected.
addopts = --reuse-db
markers =
    postgres: requires PostgreSQL row-level locking (select_for_update); skipped on SQLite
    regression: permanent anti-regression test for a specific fixed bug (tests/regression/)
    workflow: end-to-end business workflow contract (tests/workflows/)
    flaky_quarantine: known-flaky; runs in a non-blocking CI lane until fixed or deleted
    no_invariant_check: opt out of the Phase 2 invariant teardown hook (test builds a deliberately broken mid-state)
