id: QOS-0044
category: INNOVATION
title: Automated collection-risk scoring with escalating dunning
persona:
- P1
archetype:
- ARCH-03
journey: Receivables management
problem: 'collection-risk scoring exists as a LIM. Investigation found the "reminder" and "call task"
  rungs of the proposed escalation ladder already exist: automated reminders (payments/dunning.py, QOS-0032)
  and a critical-severity AR_COLLECTION_RISK row on the Attention Center (insights/attention.py::_overdue_customer_rows,
  tested by test_b05_attention.py) that names the customer, the overdue amount, and the recommended next
  step for stop_credit/overdue_severe accounts. The one real gap was "hold new orders": the invoice-complete
  credit check only fired for a customer with an explicit credit_limit set. Fixed 2026-09-11: an opt-in
  company setting extends the hold to collection_status (stop_credit/overdue_severe) independent of a
  static limit.'
evidence:
  strength: heuristic
  source:
