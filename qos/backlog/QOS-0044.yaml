priority_rationale: 'Corrected 2026-09-11: two of the three rungs were already built and tested (reminders
  via QOS-0032, the AR_COLLECTION_RISK attention row as the call-task rung); only the status-driven hold
  was missing. Shipped as an opt-in company setting so existing tenants see no behaviour change.'
effort: S
recommendation: 'Done: Company.auto_credit_hold_on_severe_overdue (opt-in, default off) makes the invoice-complete
  check also block a stop_credit/overdue_severe customer even with no credit_limit set. The reminder and
  call-task rungs needed no new build — they already existed.'
test_required: a test that flips the flag on and confirms a no-credit-limit, overdue_severe customer is
  blocked at invoice-complete, and that it is not blocked with the flag off
