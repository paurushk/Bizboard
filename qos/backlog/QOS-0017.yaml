  reach: 3
  severity: 3
  frequency: 4
  impact_band: Medium
business_metric: nps
priority: P1-investigate
priority_rationale: Impact Medium (36); hypothesis -> investigation, pending the observation layer.
effort: M
recommendation: Add a Playwright assertion during POS that counts opened [role=dialog] elements (target
  0 blocking) and that focus stays in the scan field across a 5-line checkout.
test_required: a POS friction spec (modal count + focus retention) in the e2e suite
guard_ref:
  test: web/e2e/pos-friction.spec.ts::opens with the scan field focused and no blocking dialog
