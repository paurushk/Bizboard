  scan loop would not be caught.
evidence:
  strength: hypothesis
  source:
  - docs/TESTING_STRATEGY.md#7 G-16
  - docs/BUSINESS_ARCHETYPES_AND_PERSONAS.md section 6
  detail: No spec counts modals or asserts focus retention during POS; not observed.
