id: QOS-0002
category: SECURITY_PRIVACY
title: Not every inbound webhook has a signature-forgery test
persona:
- P1
journey: Any inbound webhook (payment capture, refund, SaaS billing)
problem: One unverified inbound webhook lets an attacker forge financial events. The WF-17 forgery pattern
  exists for one route but is not enumerated across every inbound webhook; full enumeration is mis-blocked
  behind D3 sandbox credentials it does not actually need.
evidence:
  strength: heuristic
  source:
  - docs/TESTING_STRATEGY.md#7 G-8
  - backend/tests/test_payment_webhook_adversarial.py
  - docs/FREEZE_SCOPE_COVERAGE.md H10
  detail: Static read of the webhook routes vs the one adversarial suite that exists.
scoring:
  reach: 3
  severity: 5
  frequency: 2
  impact_band: High
business_metric: renewal
priority: P1
priority_rationale: severity 5 -> High and exempt from the evidence cap; set at P1 to match the strategy
  register.
effort: M
recommendation: Enumerate every inbound webhook route; parametrise each with {missing signature, wrong
  signature, replayed event id} -> all must 400 / no-op. The signature check needs no live credentials.
test_required: a parametrised webhook-forgery test covering every inbound route, blocking in CI
guard_ref:
  test: backend/tests/errors/test_webhook_enumeration.py::test_inbound_webhook_set_is_exactly_the_known_two
lifecycle: fixed
owner: backend
opened: '2026-09-10'
