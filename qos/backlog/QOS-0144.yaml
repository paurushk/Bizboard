scoring:
  reach: 2
  severity: 2
  frequency: 2
  impact_band: "Low"
business_metric: "none"
priority: "P3"
priority_rationale: "Impact Low. The behaviour is built and tested; this closes the human check. The sub-module stays off for every company until it is granted."
effort: "S"
recommendation: "Put /floor?company=<id> on one Android tablet on a floor, have an operator sign in and run three job cards, and note anything hard to tap or read. Also switch the tablet's network off for a few taps and confirm the taps are kept and sent, in order, when it is back."
