id: "QOS-0144"
category: "USABILITY"
title: "Shop-floor tablet: try it on a real device on the floor"
persona: ["P2"]
journey: "An operator starts, pauses and finishes a job card on a tablet with gloves and poor light"
problem: "The tablet page (/floor) was checked in a desktop browser and by unit tests. Button size, readability in bright light, the PIN pad on a real keyboard and the polling every 20 seconds have not been tried on an actual tablet by an actual operator."
evidence:
  strength: "heuristic"
  source: ["docs/MANUFACTURING_IMPLEMENTATION_PLAN.md"]
