id: "QOS-0103"
category: "SECURITY_PRIVACY"
title: "No multi-factor authentication; phone-OTP and invite paths would have bypassed one"
persona:
- "P1"
- "P5"
journey: "Owner or accountant signs in to a company that moves money"
problem: "Sign-in was password (or phone OTP) only, so a phished OWNER credential could record payments, change masters and export tenant data. Adding TOTP naively would also have left two single-factor session paths open: phone-OTP login and invite acceptance."
evidence:
  strength: "heuristic"
  source:
  - "backend/accounts/views.py"
  - "docs/reviews/ISO25010_QUALITY_ASSESSMENT_2026-10-02.md"
  detail: "Code read 2026-10-02: no TOTP or WebAuthn anywhere; VerifyOtpView and AcceptInviteView mint sessions from one factor."
scoring:
  reach: 4
  severity: 4
  frequency: 3
  impact_band: "High"
business_metric: "renewal"
priority: "P1"
priority_rationale: "High impact (4x4x3=48) but heuristic evidence caps at P1."
effort: "L"
recommendation: "Shipped: TOTP (RFC 6238, stdlib), encrypted secret (MultiFernet key list, rotatable with rotate_encrypted_fields), single-use recovery codes, replay protection, 5-failure lockout, a login challenge on the password, phone-OTP and invite paths, and an enrolment panel. Mandatory for money roles: MFA_ENFORCE_FOR_MONEY_ROLES is on by default in production and staging and covers OWNER, ACCOUNTANT and anyone with can_post_journals (an enrol token at login lets them enrol without a session); turning it off there needs MFA_ENFORCE_WAIVER=1, and boot refuses an empty MFA_ENCRYPTION_KEY. Sales staff without journal rights stay optional (decision Q7, 2026-10-22). Verified 2026-10-22 against test_mfa.py (phone OTP, invite with/without code, replay, enforcement per role, enrol token) as WP-H1 of docs/roadmap/SAAS_READINESS_IMPLEMENTATION_PLAN_2026-10-21.md."
test_required: "backend/tests/test_mfa.py, web/src/pages/LoginPage.mfa.test.tsx, web/src/components/TwoStepVerificationPanel.test.tsx"
guard_ref:
  test: "backend/tests/test_mfa.py"
lifecycle: "verified"
owner: "founder"
opened: "2026-10-02"
closed: "2026-10-22"
