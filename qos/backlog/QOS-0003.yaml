  not the staging host the SLO targets); the Complete-scenario number is not usable as-is — the script
  reuses one pre-created draft so 314/315 samples measure "already completed" 400-rejection latency, not
  real Complete work (script gap, tracked, not fixed this pass). Full detail: docs/roadmap/ticket-logs/X-01.md.'
