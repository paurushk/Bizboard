problem: 'Fixed 2026-09-11 (payee-memory half only, per explicit user direction): the "amount + date fuzz,
  narration NLP" rule engine already existed (payments.recon .score_match). What was missing — a payee-memory
  layer — is now built: payments.models.PayeeMemory records the significant narration tokens (payments.recon.narration_tokens)
  of every confirmed match against the customer/supplier it was confirmed to, bootstrapped entirely from
  THIS tenant''s own recon history (no external corpus, no cross-tenant training, not a trained ML model).
  A later, differently-worded line for the same payee gets a capped confidence bonus (payments.recon.payee_memory_bonus,
  max 20) layered on top of score_match — proven unable to bypass its existing amount-match safety rail.
  Precision/recall against real messy bank data is still unmeasured (this session has none) — that half
  of the original ask stays open if pursued further.'
