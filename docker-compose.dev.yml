# Thin DEV overlay. Pins the current Compose project and volume names so
# existing local data (`bizboard_postgres_data`, etc.) is unchanged.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   .\scripts\compose-env.ps1 dev up -d
#
# Production is docker-compose.prod.yml — do not use this overlay on a prod host.
# See docs/DOCKER_ENVIRONMENT.md
name: bizboard

networks:
  default:
    name: bizboard_default

volumes:
  postgres_data:
    name: bizboard_postgres_data
  redis_data:
    name: bizboard_redis_data
  media_data:
    name: bizboard_media_data
  static_data:
    name: bizboard_static_data
  pip_cache:
    name: bizboard_pip_cache

services:
  migrate:
    environment:
      BIZBOARD_COMPOSE_ENV: development
  api:
    environment:
      BIZBOARD_COMPOSE_ENV: development
      OTP_DEBUG_ECHO: "1"
      PORTAL_DEBUG_ECHO: "1"
      EMAIL_HOST: ""
      USE_TLS: "0"
      UNSUBSCRIBED_SEAT_LIMIT: "0"
      ENABLE_REPLENISHMENT: "1"
      ENABLE_GST_GUARD: "1"
      ENABLE_ROUTE_PROFIT: "1"
      ENABLE_SUPPLIER_PRICE_HISTORY: "1"
      ENABLE_CUSTOMER_PORTAL: "1"
      ENABLE_SETUP_WIZARD: "0"
      ENABLE_POS: "1"
      ENABLE_ACCOUNTING: "1"
      ENABLE_CUSTOMER_360: "1"
      E2E_GOLDEN_GRANT: "1"
  worker:
    environment:
      BIZBOARD_COMPOSE_ENV: development
      OTP_DEBUG_ECHO: "1"
      PORTAL_DEBUG_ECHO: "1"
      EMAIL_HOST: ""
      USE_TLS: "0"
      UNSUBSCRIBED_SEAT_LIMIT: "0"
      ENABLE_REPLENISHMENT: "1"
      ENABLE_GST_GUARD: "1"
      ENABLE_ROUTE_PROFIT: "1"
      ENABLE_SUPPLIER_PRICE_HISTORY: "1"
      ENABLE_CUSTOMER_PORTAL: "1"
      ENABLE_SETUP_WIZARD: "0"
      ENABLE_POS: "1"
      ENABLE_ACCOUNTING: "1"
      ENABLE_CUSTOMER_360: "1"
      E2E_GOLDEN_GRANT: "1"
  beat:
    environment:
      BIZBOARD_COMPOSE_ENV: development
  backup:
    environment:
      BIZBOARD_COMPOSE_ENV: development
    volumes:
      - ./backups/dev:/backups
      - ./scripts/backup.sh:/backup.sh:ro
  restore:
    environment:
      BIZBOARD_COMPOSE_ENV: development
    volumes:
      - ./backups/dev:/backups
      - ./scripts/restore.sh:/restore.sh:ro
