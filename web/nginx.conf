# Customer share links (invoice, quotation, pay, portal) carry a secret token in the path: they
# must never be indexed, even though the page itself is the SPA shell.
map $request_uri $bb_robots_tag {
    ~^/(i|q|pay|portal)/ "noindex, nofollow";
    default "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # M1-020: do not advertise the nginx version.
    server_tokens off;

    # M1-015: compress text assets (MUI / react / query bundles are hundreds of KB).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # WP-1 (ZAP 10063): camera for barcode scan, location for the customer address pin; nothing else.
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=()" always;
    add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;  # ZAP 90004; popups: Google sign-in, payment page
    # BB-000605: MUI Emotion + Google Fonts
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://accounts.google.com/gsi/client; frame-src 'self' blob: https://challenges.cloudflare.com https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://*.ingest.sentry.io https://*.sentry.io https://accounts.google.com/gsi/; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # BB-000755: SPA shell + service worker must not be cached long.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Robots-Tag $bb_robots_tag always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=()" always;
        add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;  # ZAP 90004; popups: Google sign-in, payment page
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://accounts.google.com/gsi/client; frame-src 'self' blob: https://challenges.cloudflare.com https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://*.ingest.sentry.io https://*.sentry.io https://accounts.google.com/gsi/; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
    }

    location ~* ^/(sw\.js|workbox[^/]*\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=()" always;
        add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;  # ZAP 90004; popups: Google sign-in, payment page
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://accounts.google.com/gsi/client; frame-src 'self' blob: https://challenges.cloudflare.com https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://*.ingest.sentry.io https://*.sentry.io https://accounts.google.com/gsi/; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
    }

    # M1-019: a missing build asset must 404, not return the HTML shell with 200
    # (which masks broken deploys and yields a confusing MIME/parse error).
    # WP-SC1: security.txt (RFC 9116) as plain text, never the SPA shell.
    location = /.well-known/security.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # BB-000305 / BB-000755: immutable only for hashed build assets (not sw/workbox).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=()" always;
        add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;  # ZAP 90004; popups: Google sign-in, payment page
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://accounts.google.com/gsi/client; frame-src 'self' blob: https://challenges.cloudflare.com https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://*.ingest.sentry.io https://*.sentry.io https://accounts.google.com/gsi/; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
    }
}
