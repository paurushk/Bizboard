# Thin STAGING overlay. Independent project, volumes, network, env, backups,
# and host port. Must never share persistent data with DEV.
#
#   copy .env.staging.example → .env.staging  (gitignored)
#   docker compose --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml --profile migrate run --rm migrate
#   docker compose --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml up -d
#   .\scripts\compose-env.ps1 staging up -d
#
# STG-17 DB roles: migrate/backup/restore/seed use the OWNER role POSTGRES_USER (a
# Postgres superuser, which bypasses FORCE RLS). api/worker/beat use the separate
# APP_DB_USER (NOSUPERUSER NOBYPASSRLS) so row-level security is actually enforced.
# Create/refresh that role after every migrate:  scripts/staging-db-role.sh
# Seed as the owner role:  ... --profile migrate run --rm migrate python manage.py seed_staging
#
# This is local/pre-staging, not production. Production remains:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml
# See docs/DOCKER_ENVIRONMENT.md
name: bizboard-staging

networks:
  default:
    name: bizboard_staging_net

volumes:
  postgres_data:
    name: bizboard_staging_postgres
  redis_data:
    name: bizboard_staging_redis
  media_data:
    name: bizboard_staging_media
  static_data:
    name: bizboard_staging_static
  pip_cache:
    name: bizboard_pip_cache

services:
  migrate:
    image: bizboard-api:latest
    env_file:
      - path: .env.staging
        required: true
    environment:
      DJANGO_ENV: staging
      DJANGO_DEBUG: "0"
      BIZBOARD_COMPOSE_ENV: staging
      POSTGRES_RLS_ENABLED: ${POSTGRES_RLS_ENABLED:-1}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    command:
      [
        "sh",
        "-c",
        "echo '[bizboard] compose_env=staging migrate' && exec python manage.py migrate --noinput",
      ]
  api:
    env_file:
      - path: .env.staging
        required: true
    environment:
      DJANGO_ENV: staging
      DJANGO_DEBUG: "0"
      BIZBOARD_COMPOSE_ENV: staging
      # WP-D2: multiprocess metrics; the directory is a tmpfs emptied at every start.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom
      POSTGRES_RLS_ENABLED: ${POSTGRES_RLS_ENABLED:-1}
      DATABASE_URL: postgresql://${APP_DB_USER:?Set APP_DB_USER in .env.staging}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env.staging}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    command: >
      sh -c "echo '[bizboard] compose_env=staging django_env=staging' &&
      mkdir -p /tmp/prom && rm -rf /tmp/prom/* &&
      exec gunicorn config.wsgi:application -c config/gunicorn.conf.py --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-2} --timeout 120"
    tmpfs:
      - /tmp/prom
  worker:
    image: bizboard-api:latest
    env_file:
      - path: .env.staging
        required: true
    environment:
      DJANGO_ENV: staging
      DJANGO_DEBUG: "0"
      BIZBOARD_COMPOSE_ENV: staging
      # WP-D2: multiprocess metrics; the directory is a tmpfs emptied at every start.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom
      WORKER_METRICS_PORT: "9100"
      POSTGRES_RLS_ENABLED: ${POSTGRES_RLS_ENABLED:-1}
      DATABASE_URL: postgresql://${APP_DB_USER:?Set APP_DB_USER in .env.staging}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env.staging}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    command: >
      sh -c "echo '[bizboard] compose_env=staging worker' &&
      mkdir -p /tmp/prom && rm -rf /tmp/prom/* &&
      exec celery -A config worker -l info -Q celery,high_priority,media_heavy,reports,agents,agents_interactive"
    tmpfs:
      - /tmp/prom
  beat:
    image: bizboard-api:latest
    env_file:
      - path: .env.staging
        required: true
    environment:
      DJANGO_ENV: staging
      DJANGO_DEBUG: "0"
      BIZBOARD_COMPOSE_ENV: staging
      POSTGRES_RLS_ENABLED: ${POSTGRES_RLS_ENABLED:-1}
      DATABASE_URL: postgresql://${APP_DB_USER:?Set APP_DB_USER in .env.staging}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env.staging}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    command: >
      sh -c "echo '[bizboard] compose_env=staging beat' &&
      exec celery -A config beat -l info"
  backup:
    env_file:
      - path: .env.staging
        required: true
    environment:
      BIZBOARD_COMPOSE_ENV: staging
    volumes:
      - ./backups/staging:/backups
      - ./scripts/backup.sh:/backup.sh:ro
  restore:
    env_file:
      - path: .env.staging
        required: true
    environment:
      BIZBOARD_COMPOSE_ENV: staging
    volumes:
      - ./backups/staging:/backups
      - ./scripts/restore.sh:/restore.sh:ro
  test:
    env_file:
      - path: .env.staging
        required: false
    environment:
      BIZBOARD_COMPOSE_ENV: staging
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  web:
    image: bizboard-web
  nginx:
    ports: !override
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8081}:80"
