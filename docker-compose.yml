# BB-000217: POSTGRES_PASSWORD and REDIS_PASSWORD must be set in .env (no weak defaults).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # BB-000714: one-shot migrate via profile (match prod) — not on api start.
  #   docker compose --profile migrate run --rm migrate
  migrate:
    profiles: ["migrate"]
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # BB-000710: default off; env_file / shell can override (do not hard-pin "0").
      POSTGRES_RLS_ENABLED: ${POSTGRES_RLS_ENABLED:-0}
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    # M1-014: stable tag so CI (and ops) can scan / reference the built image.
    image: bizboard-api:latest
    restart: unless-stopped
    # BB-000714: api must NOT migrate on start — use `--profile migrate` first.
    command: >
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-2} --timeout 120
    # BB-000314: required:false for local/dev; a prod overlay should set required:true.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # BB-000710: compose POSTGRES_USER is typically a superuser — default RLS off.
      # Use ${POSTGRES_RLS_ENABLED:-0} so .env / env_file can enable RLS without editing compose.
      POSTGRES_RLS_ENABLED: ${POSTGRES_RLS_ENABLED:-0}
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Liveness only — nginx should not wait on Celery (omit ?ready=1).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A config worker -l info
    # BB-000314: required:false for local/dev; a prod overlay should set required:true.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # BB-000710: allow env_file to win over a hard-coded "0".
      POSTGRES_RLS_ENABLED: ${POSTGRES_RLS_ENABLED:-0}
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Worker has no gunicorn; compose healthcheck uses the Celery broker.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from config.celery import app; app.broker_connection().ensure_connection(max_retries=1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s

  beat:
    # BB-000636: run exactly one beat replica. Do not `compose up --scale beat=N`.
    build: ./backend
    restart: unless-stopped
    command: celery -A config beat -l info
    # BB-000314: required:false for local/dev; a prod overlay should set required:true.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      POSTGRES_RLS_ENABLED: ${POSTGRES_RLS_ENABLED:-0}
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,redis,time; r=redis.from_url(os.environ['REDIS_URL']); raw=r.get('bizboard:celery_beat_heartbeat'); assert raw, 'beat heartbeat missing'; ts=float(raw.decode() if isinstance(raw,bytes) else raw); assert time.time()-ts < 180, 'beat heartbeat stale'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s

  backup:
    profiles: ["backup"]
    image: postgres:17-alpine
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

  # Wave 16A: restore latest dump (ops must still record dated restore drill).
  restore:
    profiles: ["restore"]
    image: postgres:17-alpine
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      RESTORE_FILE: ${RESTORE_FILE:-}
    volumes:
      - ./backups:/backups
      - ./scripts/restore.sh:/restore.sh:ro
    entrypoint: ["/bin/sh", "/restore.sh"]
    depends_on:
      db:
        condition: service_healthy

  # Backend test suite / linters in a throwaway container — Python 3.14 comes from
  # the ./backend base image (python:3.14-slim-bookworm), matching CI. Never starts
  # on `docker compose up` (profile-gated). Dev-only tooling (pytest/ruff) is layered
  # in at run time from requirements-dev.txt and cached in the pip_cache volume.
  #   docker compose --profile test build test                        # REQUIRED after any backend/ code change (run does not rebuild)
  #   docker compose --profile test run --rm test                     # full suite, in-memory SQLite (fast)
  #   docker compose --profile test run --rm -e CI=1 test             # against the Postgres `db` service (SELECT ... FOR UPDATE fidelity)
  #   docker compose --profile test run --rm test ruff check .
  #   docker compose --profile test run --rm test python manage.py makemigrations --check --dry-run
  #   docker compose --profile test run --rm test python manage.py spectacular --file /tmp/openapi.json
  # (No source bind-mount: backend/.venv on the Windows host makes it unusably slow. `build` is ~30s.)
  test:
    profiles: ["test"]
    build: ./backend
    image: bizboard-test
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PIP_CACHE_DIR: /pip-cache
    # Backend code + tests run from the baked image (fast on Docker Desktop for
    # Windows, where bind mounts are slow). A ~17-test subset asserts on repo-root
    # files outside backend/ (docker-compose.yml, web/, mobile/, .github/) — those
    # only pass in CI, which checks out the whole repo; run them there, not here.
    volumes:
      - pip_cache:/pip-cache
    # M1-033: docker-entrypoint-test.sh drops from root to the unprivileged
    # `app` user (chowning the pip-cache volume first) before installing dev
    # requirements and running the actual command — this entrypoint override
    # used to bypass the image's privilege drop entirely and run as root.
    entrypoint: ["/app/docker-entrypoint-test.sh"]
    command: ["pytest", "-q"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  # Optional ClamAV for OCR/media (Wave 16A). App fail-opens with alert if unreachable.
  clamav:
    profiles: ["clamav"]
    image: clamav/clamav:1.4
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_ENABLE_ACCOUNTING: ${VITE_ENABLE_ACCOUNTING:-true}
        VITE_ENABLE_AI: ${VITE_ENABLE_AI:-false}
        VITE_ENABLE_TALLY: ${VITE_ENABLE_TALLY:-false}
        VITE_ENABLE_GSTR: ${VITE_ENABLE_GSTR:-true}
        VITE_ENABLE_EINVOICE_SUBMIT: ${VITE_ENABLE_EINVOICE_SUBMIT:-true}
        VITE_ENABLE_POS: ${VITE_ENABLE_POS:-true}
        VITE_ENABLE_MANUFACTURING: ${VITE_ENABLE_MANUFACTURING:-false}
        VITE_ENABLE_PAYROLL: ${VITE_ENABLE_PAYROLL:-false}
        VITE_ENABLE_CRM: ${VITE_ENABLE_CRM:-false}
    restart: unless-stopped
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # M1-004: bind to loopback by default — this listener is plain HTTP and
      # must sit behind a TLS edge. A deploy that fronts it with a real HTTPS
      # terminator sets APP_BIND=0.0.0.0 (or an explicit LAN IP) deliberately.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/var/www/media:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  # BB-000521: shared media has no built-in AV scan — optional clamav profile can mount here.
  media_data:
  # pip download cache for the `test` profile so dev-tooling installs are slow only once.
  pip_cache:
