# BB-000368: production overlay — require secrets file; use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Ops checklist (BB-000440 / BB-000470): terminate TLS at the edge; pin image
# digests in deploy manifests (not mutable :sha tags alone), e.g.:
#   image: ghcr.io/org/bizboard-api@sha256:<digest from GHCR>
# Verify beat heartbeat key `bizboard:celery_beat_heartbeat` is fresh (<180s);
# run one-shot `migrate` before rolling api:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile migrate run --rm migrate
# CSRF_COOKIE_SECURE is True when DJANGO_ENV=production — require HTTPS at the edge.
services:
  migrate:
    profiles: ["migrate"]
    build: ./backend
    env_file:
      - path: .env
        required: true
    environment:
      DJANGO_ENV: production
      DJANGO_DEBUG: "0"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    # One-shot schema apply (BB-000452):
    #   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile migrate run --rm migrate
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
  api:
    env_file:
      - path: .env
        required: true
    environment:
      DJANGO_ENV: production
      DJANGO_DEBUG: "0"
    # BB-000124: prod API must NOT migrate on start — use `--profile migrate` job first.
    command: >
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-2} --timeout 120
    # Prefer digest-pinned images in real deploy (example):
    # image: ghcr.io/org/bizboard-api@sha256:...
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/?ready=1')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  worker:
    env_file:
      - path: .env
        required: true
    environment:
      DJANGO_ENV: production
      DJANGO_DEBUG: "0"
  beat:
    env_file:
      - path: .env
        required: true
    environment:
      DJANGO_ENV: production
      DJANGO_DEBUG: "0"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,redis,time; r=redis.from_url(os.environ['REDIS_URL']); raw=r.get('bizboard:celery_beat_heartbeat'); assert raw, 'beat heartbeat missing'; ts=float(raw.decode() if isinstance(raw,bytes) else raw); assert time.time()-ts < 180, 'beat heartbeat stale'",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
