# Human corrections applied after heuristic coverage labels (P1-T4 / D5).
# Keyed by path (routes) or action id. Non-destructive: only listed fields
# replace the generated value. Same idea as qos/tools/merge.py.
#
# On generator-vs-review disagreement, log it in the landing PR (D4).
# S0: only relabel when a golden asserts a money/status consequence.

