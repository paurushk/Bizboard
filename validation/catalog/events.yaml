    document_types: [quotation, sales_order, delivery_challan]
    extended: true
    g_ids: []
    note: "Quote→SO→challan→invoice (WF-06/09/10). Checklist CFT-114/CFT-115. Stock reservation until challan/invoice complete; quotation itself never posts stock/GL."
    impacts:
      stock: lim
      gl: no
      ar_ap: no
      gst: no
      reports: lim
      attention: no
      dashboard: lim
      badge_ui: yes
      channel: no
      historical_period: required
