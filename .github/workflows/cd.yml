name: CD

# BB-000284 / BB-000368 / BB-000442: publish images after CI succeeds on main
# (sha tags always; latest gated). Validate compose.prod before push.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      push_latest:
        description: "Also push :latest tags"
        required: false
        default: "false"
      # R5-009: a manual dispatch bypasses the automatic "CI succeeded on this
      # SHA" gate. Require the operator to explicitly attest CI is green.
      confirm_ci_green:
        description: "Type 'yes' to confirm CI has passed for this SHA"
        required: true
        default: "no"

permissions:
  contents: read
  packages: write

jobs:
  gate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Require CI success for SHA
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          test "${{ github.event.workflow_run.conclusion }}" = "success"
          echo "CI SHA=${{ github.event.workflow_run.head_sha }} ok"
      - name: Require CI attestation on manual dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          test "${{ github.event.inputs.confirm_ci_green }}" = "yes" \
            || { echo "::error::Set confirm_ci_green=yes only after CI has passed for this SHA."; exit 1; }
      # BB-000749: seed dummy .env before compose.prod config (match CI docker job).
      - name: Compose env for CD
        run: |
          printf '%s\n' \
            'POSTGRES_DB=bizboard' \
            'POSTGRES_USER=bizboard' \
            'POSTGRES_PASSWORD=ci-only-not-for-prod' \
            'REDIS_PASSWORD=ci-redis-not-for-prod' > .env
      - name: Validate compose.prod
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config >/dev/null
          ! grep -n "or True" docker-compose.prod.yml

  push-images:
    needs: [gate]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Log in to GHCR
        # BB-000508: pin Action major; prefer digest pin in fork hardening.
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image prefix
        id: meta
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Build and push API
        run: |
          docker build -t "${{ steps.meta.outputs.prefix }}/bizboard-api:${{ steps.meta.outputs.sha }}" ./backend
          docker push "${{ steps.meta.outputs.prefix }}/bizboard-api:${{ steps.meta.outputs.sha }}"
          if [ "${{ github.event.inputs.push_latest || 'false' }}" = "true" ]; then
            docker tag "${{ steps.meta.outputs.prefix }}/bizboard-api:${{ steps.meta.outputs.sha }}" \
              "${{ steps.meta.outputs.prefix }}/bizboard-api:latest"
            docker push "${{ steps.meta.outputs.prefix }}/bizboard-api:latest"
          fi
      - name: Build and push Web
        run: |
          docker build \
            --build-arg VITE_ENABLE_ACCOUNTING=true \
            --build-arg VITE_ENABLE_AI=false \
            --build-arg VITE_ENABLE_TALLY=false \
            --build-arg VITE_ENABLE_GSTR=true \
            --build-arg VITE_ENABLE_EINVOICE_SUBMIT=true \
            --build-arg VITE_ENABLE_POS=true \
            --build-arg VITE_ENABLE_MANUFACTURING=false \
            --build-arg VITE_ENABLE_PAYROLL=false \
            --build-arg VITE_ENABLE_CRM=false \
            -t "${{ steps.meta.outputs.prefix }}/bizboard-web:${{ steps.meta.outputs.sha }}" ./web
          docker push "${{ steps.meta.outputs.prefix }}/bizboard-web:${{ steps.meta.outputs.sha }}"
          if [ "${{ github.event.inputs.push_latest || 'false' }}" = "true" ]; then
            docker tag "${{ steps.meta.outputs.prefix }}/bizboard-web:${{ steps.meta.outputs.sha }}" \
              "${{ steps.meta.outputs.prefix }}/bizboard-web:latest"
            docker push "${{ steps.meta.outputs.prefix }}/bizboard-web:latest"
          fi
      - name: Pin image digests
        run: |
          chmod +x scripts/pin_image_digests.sh
          API="${{ steps.meta.outputs.prefix }}/bizboard-api:${{ steps.meta.outputs.sha }}"
          WEB="${{ steps.meta.outputs.prefix }}/bizboard-web:${{ steps.meta.outputs.sha }}"
          ./scripts/pin_image_digests.sh "$API" "$WEB" docker-compose.digest.yml
          grep -E '@sha256:[0-9a-f]{32,}' docker-compose.digest.yml >/dev/null \
            || { echo "::error::W0-08b image digest pin missing"; exit 1; }
