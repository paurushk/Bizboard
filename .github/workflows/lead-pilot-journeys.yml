# Stabilization WP-6 (docs/STABILIZATION_PLAN.md): every night, run the lead-pilot golden journeys
# (ARCH-01 counter retail, ARCH-03 semi-wholesale; list in web/playwright.golden.config.ts
# LEAD_PILOT_SPECS) against a live backend on Postgres, at desktop and at Android-phone size.
# A failure uploads the trace and screenshots; file a QOS card from them, don't re-run blindly.
name: lead-pilot-journeys

on:
  schedule:
    - cron: "0 22 * * *"  # 03:30 IST, after nightly-ledger
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bizboard_ci
          POSTGRES_USER: bizboard
          POSTGRES_PASSWORD: bizboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "1"
      DATABASE_URL: postgresql://bizboard:bizboard@localhost:5432/bizboard_ci
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: "1"
      CELERY_TASK_ALWAYS_EAGER: "1"
      REDIS_URL: ""
      E2E_GOLDEN_API_PORT: "8000"
      E2E_GOLDEN_WEB_PORT: "5173"
      OTP_DEBUG_ECHO: "1"
      E2E_GOLDEN_PHONE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install backend
        working-directory: backend
        run: |
          pip install -c constraints.txt -r requirements-dev.txt
          python manage.py migrate --noinput
      - name: Install frontend + Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Lead-pilot journeys (desktop + phone)
        run: >-
          npx playwright test --config=playwright.golden.config.ts --trace=retain-on-failure
          lifecycle-arch01 lifecycle-arch03 pos-golden-path invoice-golden-path quotation-inline-customer
          payments-golden-path money-in-golden collection-walk returns-golden purchase-golden-path
          route-pod-golden accounting-golden-path repeat-last-invoice-golden-path lead-pilot-gaps
          comp002-replenishment
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lead-pilot-traces
          path: web/test-results/
          retention-days: 14
