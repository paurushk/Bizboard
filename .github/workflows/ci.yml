name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # BUG-712: run the suite against real Postgres, not just SQLite — SQLite
    # doesn't meaningfully enforce SELECT ... FOR UPDATE locking, so the
    # concurrency-sensitive tests (payment allocation, stock oversell) would
    # pass here even with a real race bug and only fail under production load.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bizboard_ci
          POSTGRES_USER: bizboard
          POSTGRES_PASSWORD: bizboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
      DATABASE_URL: postgresql://bizboard:bizboard@localhost:5432/bizboard_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # BUG-711: requirements.txt no longer carries test/lint tooling —
      # requirements-dev.txt (which includes it) is what CI actually needs.
      # BB-000125: prefer constraints.txt when present for tighter upper pins.
      - run: pip install -c constraints.txt -r requirements-dev.txt
      - run: ruff check .
      # BUG-714: dependency vulnerability scan — would have caught known
      # CVEs the moment they're published, not whenever someone happens to run it.
      - run: pip install pip-audit && pip-audit -r requirements.txt --desc
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py spectacular --file ../docs/openapi-snapshot.json
      # BB-000750: fail if OpenAPI snapshot drifts after regenerate.
      - name: Assert OpenAPI snapshot clean
        working-directory: .
        run: git diff --exit-code docs/openapi-snapshot.json
      - name: Assert helpCodes.json matches help_codes.py
        run: |
          python manage.py dump_help_codes
          git diff --exit-code ../web/src/pages/help/helpCodes.json
      # BB-000533: H9 amend adversarial regression must stay in CI.
      - run: pytest tests/test_wave2_open_fixes.py -k h9 tests/test_wave3_books.py -k h9
      - run: pytest
      - name: Wave 16/17/18 assert gates
        working-directory: .
        run: |
          python docs/reviews/_wave16_assert_gates.py
          python docs/reviews/_wave17_assert_gates.py
          python docs/reviews/_wave18_assert_gates.py
          python docs/reviews/_wave19_assert_gates.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: OpenAPI types stub check
        run: node -e "const fs=require('fs'); const t=fs.readFileSync('src/api/openapi-types.ts','utf8'); if(!t.includes('export interface paths')) { console.error('openapi-types.ts missing export interface paths'); process.exit(1); }"
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      # BUG-714/715: fail loudly on known-vulnerable dependencies instead of
      # relying on someone remembering to run `npm audit` manually.
      - run: npm audit --omit=dev --audit-level=high

  # BB-000748: lightweight mobile gate (no Android SDK / Gradle assemble).
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Assert mobile package.json
        working-directory: .
        run: |
          test -f mobile/package.json
          node -e "require('./mobile/package.json')"
      - name: Install mobile deps
        run: npm ci
      - name: Typecheck or test
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit
          elif node -e "const s=require('./package.json').scripts||{}; process.exit(s.test ? 0 : 1)"; then
            npm test
          else
            echo "No tsconfig.json or npm test script; npm ci succeeded."
          fi
      - name: Assert Capacitor config + allowBackup=false
        working-directory: .
        run: |
          test -f mobile/capacitor.config.ts
          grep -q 'android:allowBackup="false"' mobile/android/app/src/main/AndroidManifest.xml

  # Light e2e (no API). Merge gate remains e2e-golden below.
  # BB-000310: continue-on-error removed — light e2e failures must surface.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "1"

  # Required golden path against real Postgres + Django (Chromium).
  e2e-golden:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bizboard_ci
          POSTGRES_USER: bizboard
          POSTGRES_PASSWORD: bizboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "1"
      DATABASE_URL: postgresql://bizboard:bizboard@localhost:5432/bizboard_ci
      DJANGO_SETTINGS_MODULE: config.settings
      CELERY_TASK_ALWAYS_EAGER: "1"
      E2E_GOLDEN_API_PORT: "8000"
      E2E_GOLDEN_WEB_PORT: "5173"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install backend
        working-directory: backend
        run: |
          # BB-000125: apply constraints.txt for tighter reproducible pins
          pip install -c constraints.txt -r requirements-dev.txt
          python manage.py migrate --noinput
      - name: Install frontend + Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Golden e2e
        run: npm run test:e2e:golden

  # BUG-713: CI never validated docker-compose.yml or the Dockerfiles it
  # references — a broken compose file (or a bad Dockerfile, see the
  # .dockerignore fixes) wouldn't be caught until an actual deploy attempt.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose env for CI
        run: |
          printf '%s\n' \
            'POSTGRES_DB=bizboard' \
            'POSTGRES_USER=bizboard' \
            'POSTGRES_PASSWORD=ci-only-not-for-prod' \
            'REDIS_PASSWORD=ci-redis-not-for-prod' > .env
      - run: docker compose config
      - run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config
      - run: docker compose build

  # BB-000477: optional load harness presence check (not a soak).
  load-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert k6 smoke script exists
        run: test -f load/k6_smoke.js && test -f load/locust_smoke.py

  # Wave 17A: optional Postgres RLS isolation job (flag on; default prod still off).
  postgres-rls:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bizboard_ci
          POSTGRES_USER: bizboard
          POSTGRES_PASSWORD: bizboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
      DATABASE_URL: postgresql://bizboard:bizboard@localhost:5432/bizboard_ci
      POSTGRES_RLS_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -c constraints.txt -r requirements-dev.txt
      - run: python manage.py migrate --noinput
      - name: Tenant isolation smoke
        run: pytest tests/test_phase5_accounting.py -k tenant tests/test_help_resolution.py -k staff_all -q --tb=line
      - name: Wave 17/18/19 assert gates
        working-directory: .
        run: |
          python docs/reviews/_wave17_assert_gates.py
          python docs/reviews/_wave18_assert_gates.py
          python docs/reviews/_wave19_assert_gates.py
