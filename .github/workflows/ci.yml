name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # BUG-712: run the suite against real Postgres, not just SQLite — SQLite
    # doesn't meaningfully enforce SELECT ... FOR UPDATE locking, so the
    # concurrency-sensitive tests (payment allocation, stock oversell) would
    # pass here even with a real race bug and only fail under production load.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bizboard_ci
          POSTGRES_USER: bizboard
          POSTGRES_PASSWORD: bizboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
      DATABASE_URL: postgresql://bizboard:bizboard@localhost:5432/bizboard_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # BUG-711: requirements.txt no longer carries test/lint tooling —
      # requirements-dev.txt (which includes it) is what CI actually needs.
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # BUG-714: dependency vulnerability scan — would have caught known
      # CVEs the moment they're published, not whenever someone happens to run it.
      - run: pip install pip-audit && pip-audit -r requirements.txt --desc || true
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      # BUG-714/715: fail loudly on known-vulnerable dependencies instead of
      # relying on someone remembering to run `npm audit` manually.
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "1"

  # BUG-713: CI never validated docker-compose.yml or the Dockerfiles it
  # references — a broken compose file (or a bad Dockerfile, see the
  # .dockerignore fixes) wouldn't be caught until an actual deploy attempt.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose build
