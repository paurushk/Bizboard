# When the browser Host is a raw IP (phone → http://192.168.x.x/), Django
# DisallowedHost returns an opaque HTML 400 unless that IP is in ALLOWED_HOSTS.
# Map IP hosts to localhost (always allowed in local/docker defaults).
map $host $django_host {
    ~^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$  localhost;
    default                            $host;
}

# Cloudflare / tunnel often sends X-Forwarded-Proto: https while hitting local :80.
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # Docker embedded DNS — re-resolve service IPs after container restarts
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Baseline security headers (TLS/HSTS terminate at upstream load balancer)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $django_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location /media/ {
        alias /var/www/media/;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    location / {
        set $web_upstream http://web:80;
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
}
