# HTTP-only in this container. Terminate TLS at the load balancer / Cloudflare.
# CSRF_COOKIE_SECURE is True in Django production — do not expose this :80
# listener directly to browsers without an HTTPS edge.
# Run schema with: docker compose --profile migrate run --rm migrate

# Cloudflare / tunnel often sends X-Forwarded-Proto: https while hitting local :80.
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    https   https;
    http    http;
}

# BB-000373: edge rate limits (http context — this file is included from conf.d).
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_search:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # M1-020: do not advertise the nginx version.
    server_tokens off;

    # M1-015: compress text assets at the edge.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json application/xml;

    # Docker embedded DNS — re-resolve service IPs after container restarts
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Baseline security headers (TLS/HSTS terminate at upstream load balancer)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # BB-000605: MUI Emotion + Google Fonts
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://*.ingest.sentry.io https://*.sentry.io; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    location /api/v1/auth/ {
        limit_req zone=api_auth burst=20 nodelay;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location /api/v1/search/ {
        limit_req zone=api_search burst=10 nodelay;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # internal: unreachable by direct client request — only reachable via an
    # X-Accel-Redirect issued by the Django API after it checks tenant/auth
    # (BUG-703: this used to be a public alias, letting anyone enumerate and
    # download any tenant's invoice PDFs/attachments by guessing sequential paths).
    location /media/ {
        internal;
        alias /var/www/media/;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    location / {
        set $web_upstream http://web:80;
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
}
