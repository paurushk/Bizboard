# HTTP-only in this container. Terminate TLS at the load balancer / Cloudflare.
# CSRF_COOKIE_SECURE is True in Django production — do not expose this :80
# listener directly to browsers without an HTTPS edge.
# Run schema with: docker compose --profile migrate run --rm migrate

# Cloudflare / tunnel often sends X-Forwarded-Proto: https while hitting local :80.
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    https   https;
    http    http;
}

# M1-004: only emit HSTS on requests that reached the edge over HTTPS
# (X-Forwarded-Proto: https) — never on a plain-HTTP hit, which would pin
# clients to a broken scheme.
map $fwd_proto $hsts_header {
    https "max-age=31536000; includeSubDomains";
    default "";
}

# BB-000373: edge rate limits (http context — this file is included from conf.d).
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_search:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # M1-020: do not advertise the nginx version.
    server_tokens off;

    # M1-015: compress text assets at the edge.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json application/xml;

    # Docker embedded DNS — re-resolve service IPs after container restarts
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Baseline security headers (TLS terminates at the upstream edge)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # WP-1 (ZAP 10063): camera for barcode scan, location for the customer address pin; nothing else.
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=()" always;
    # M1-004: HSTS only when the edge served the request over HTTPS.
    add_header Strict-Transport-Security $hsts_header always;
    # BB-000605: MUI Emotion + Google Fonts
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://accounts.google.com/gsi/client; frame-src 'self' blob: https://challenges.cloudflare.com https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://*.ingest.sentry.io https://*.sentry.io https://accounts.google.com/gsi/; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    location /api/v1/auth/ {
        limit_req zone=api_auth burst=20 nodelay;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location /api/v1/search/ {
        limit_req zone=api_search burst=10 nodelay;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # Django admin — a separate, staff-only GUI from the customer SPA at `/`
    # (never merged into it). Session-cookie auth. Django's own
    # ContentSecurityPolicyMiddleware sets an admin-appropriate CSP on this
    # response on top of the baseline one this server block adds.
    location /admin/ {
        limit_req zone=api_general burst=60 nodelay;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # collectstatic output (backend/docker-entrypoint.sh) — admin's CSS/JS.
    # gunicorn never serves static files; nginx reads the shared volume.
    location /static/ {
        alias /var/www/static/;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=()" always;
    }

    # internal: unreachable by direct client request — only reachable via an
    # X-Accel-Redirect issued by the Django API after it checks tenant/auth
    # (BUG-703: this used to be a public alias, letting anyone enumerate and
    # download any tenant's invoice PDFs/attachments by guessing sequential paths).
    location /media/ {
        internal;
        alias /var/www/media/;
        # M1-021: nginx add_header does NOT inherit — a location that adds any
        # header drops the server-level set. Re-declare the full baseline so
        # media responses keep CSP + Referrer-Policy too.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=()" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox; frame-ancestors 'self';" always;
    }

    # BB-128: public status page, read from the error tracker's status page (docs/ops/GLITCHTIP.md)
    # so only this one read-only path is public, not the tracker. Without the "errors" profile
    # the name does not resolve and this answers 503; the rest of the app is unaffected.
    location = /status/ {
        limit_except GET HEAD { deny all; }
        limit_req zone=api_general burst=20 nodelay;
        set $status_upstream http://glitchtip:8000;
        proxy_pass $status_upstream/status-pages/bizboard/bizboard/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_hide_header Set-Cookie;
        # GlitchTip's own policy (style-src 'self') blocks the page's inline styles. This page
        # needs no script, form or frame, so it gets its own strict policy. add_header here
        # drops the server-level set (M1-021), so the baseline is re-declared.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'none';" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=()" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header Cache-Control "no-cache" always;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @status_unavailable;
    }
    location = /status {
        absolute_redirect off;
        return 301 /status/;
    }
    location @status_unavailable {
        default_type text/plain;
        return 503 "Status page is not available right now.\n";
    }

    location / {
        set $web_upstream http://web:80;
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
}
